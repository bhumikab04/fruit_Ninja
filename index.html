<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Fruit Slicer</title>
<style>
  :root{
    --ink:#0b0f1a;
    --gold:#feca57;
    --coral:#ff6b6b;
    --leaf:#54e6a5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--ink);font-family:'Segoe UI',Helvetica,Arial,sans-serif;height:100%;width:100%;}
  #videoFeed{
    position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);opacity:0.5;filter:saturate(1.1) brightness(0.85);
  }
  #gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;}
  #hud{
    position:fixed;top:18px;left:18px;color:#fff;z-index:5;
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:4px;
  }
  #hud .score{font-size:28px;font-weight:800;letter-spacing:.5px;}
  #hud .score span{color:var(--gold);}
  #hud .combo{font-size:15px;opacity:.85;height:18px;color:var(--leaf);font-weight:600;}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;z-index:10;background:rgba(5,8,15,0.86);padding:24px;
  }
  #overlay h1{
    font-size:clamp(32px,6vw,52px);margin:0 0 10px;
    background:linear-gradient(90deg,var(--coral),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;letter-spacing:-1px;
  }
  #overlay p{max-width:460px;line-height:1.55;opacity:.85;font-size:15px;margin:0;}
  #overlay .final{font-size:20px;margin-top:6px;opacity:1;color:var(--gold);font-weight:700;}
  button{
    margin-top:26px;padding:15px 34px;font-size:17px;border:none;border-radius:999px;
    background:linear-gradient(90deg,var(--coral),var(--gold));color:#1a1305;font-weight:800;
    cursor:pointer;letter-spacing:.3px;transition:transform .15s ease, filter .15s ease;
  }
  button:hover{filter:brightness(1.08);transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  #status{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#9aa4bd;font-size:13px;z-index:5;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<video id="videoFeed" autoplay playsinline muted></video>
<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div class="score">Score: <span id="scoreVal">0</span></div>
  <div class="combo" id="comboText"></div>
</div>

<div id="status"></div>

<div id="overlay">
  <h1>Gesture Fruit Slicer</h1>
  <p id="overlayText">Point your webcam at yourself, then slice the flying fruit with your index fingertip — just like swiping a blade. Every slice scores. Only a bomb ends the game.</p>
  <button id="startBtn">Allow Camera &amp; Start</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const videoElement = document.getElementById('videoFeed');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('scoreVal');
const comboText = document.getElementById('comboText');
const statusEl = document.getElementById('status');

function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---------- Game state ----------
let gameState = 'idle'; // idle | playing | over
let score = 0;
let combo = 0;
let comboTimer = 0;
let spawnTimer = 0;
let spawnInterval = 1100;
let fruits = [];
let particles = [];
let popups = [];
let missStreak = 0; // consecutive fruits missed without a slice in between
let trails = [[], []]; // recent fingertip points per hand: {x,y,t}
let lastFrameTime = performance.now();

const GRAVITY = 0.32;

// fun word banks shown as bold, large on-screen text
const SLICE_COMMENTS = ['Nice!', 'Sliced!', 'Sweet cut!', 'Smooth!', 'Sharp!', 'Boom!', 'Clean hit!'];
const MISS_COMMENTS = ["Stay focused!", "You've got this!", "Keep your eyes up!", "Don't give up!", "Shake it off!"];
const SCORE_COMMENTS = ['Awesome!', "You're on fire!", 'Incredible!', 'Fantastic!', 'Unstoppable!', 'Amazing streak!'];

function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

const FRUIT_TYPES = [
  {emoji:'🍉', color:'#4fd67a', r:46},
  {emoji:'🍎', color:'#ff5c5c', r:36},
  {emoji:'🍊', color:'#ff9f43', r:36},
  {emoji:'🍇', color:'#9b6bff', r:36},
  {emoji:'🍋', color:'#f6e05e', r:34},
  {emoji:'🥝', color:'#8bc34a', r:32},
];
const BOMB = {emoji:'💣', color:'#333', r:38};

function resetGame(){
  score = 0; combo = 0; comboTimer = 0; missStreak = 0;
  fruits = []; particles = []; popups = []; trails = [[], []];
  spawnInterval = 1100;
  updateHud();
}

function updateHud(){
  scoreVal.textContent = score;
  comboText.textContent = combo > 1 ? `x${combo} combo!` : '';
}

function spawnFruit(){
  const isBomb = Math.random() < 0.12;
  const type = isBomb ? BOMB : FRUIT_TYPES[Math.floor(Math.random()*FRUIT_TYPES.length)];
  const x = 60 + Math.random() * (canvas.width - 120);
  const speedBoost = Math.min(score / 300, 4);
  // pick a target peak height as a fraction of the screen, then solve for the
  // launch velocity needed to reach it under GRAVITY (v = sqrt(2 * g * h))
  const targetHeight = canvas.height * (0.62 + Math.random() * 0.3);
  const vy = -Math.sqrt(2 * GRAVITY * targetHeight) - speedBoost * 0.5;
  const vx = (Math.random()-0.5) * 4;
  fruits.push({
    x, y: canvas.height + 60, vx, vy, r: type.r,
    emoji: type.emoji, color: type.color, isBomb,
    sliced: false, rotation: Math.random()*Math.PI*2,
    vr: (Math.random()-0.5)*0.15
  });
}

function spawnParticles(x,y,color,count=14){
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 2 + Math.random()*5;
    particles.push({
      x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 2,
      life:1, decay: 0.02 + Math.random()*0.02, color, size: 2+Math.random()*4
    });
  }
}

function spawnPopup(x,y,text,color,options={}){
  popups.push({
    x, y, text, color, life:1,
    decay: options.decay ?? 0.02,
    fontSize: options.fontSize ?? 26,
    centered: options.centered ?? false
  });
}

function gameOver(){
  gameState = 'over';
  if(camera) camera.stop();
  hud.classList.add('hidden');
  overlay.classList.remove('hidden');
  overlayText.innerHTML = `<span class="final">Final Score: ${score}</span><br><br>You sliced a bomb — game over. Try again?`;
  startBtn.textContent = 'Play Again';
}

function startGame(){
  resetGame();
  gameState = 'playing';
  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  lastFrameTime = performance.now();
  requestAnimationFrame(gameLoop);
}

// ---------- Slicing detection ----------
function pointSegmentDistance(px,py, ax,ay, bx,by){
  const dx = bx-ax, dy = by-ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function checkSlices(trail){
  if(trail.length < 2) return;
  const a = trail[trail.length-2];
  const b = trail[trail.length-1];
  const dt = Math.max(b.t - a.t, 1);
  const dist = Math.hypot(b.x-a.x, b.y-a.y);
  const speed = dist / dt; // px per ms
  if(speed < 0.25) return; // require a real swipe, not a slow drift

  for(const f of fruits){
    if(f.sliced) continue;
    const d = pointSegmentDistance(f.x, f.y, a.x, a.y, b.x, b.y);
    if(d < f.r){
      f.sliced = true;
      spawnParticles(f.x, f.y, f.color, f.isBomb ? 24 : 14);
      if(f.isBomb){
        spawnPopup(f.x, f.y, 'BOOM', '#ff5c5c', {fontSize:34});
        gameOver();
        return;
      } else {
        missStreak = 0; // a successful slice breaks any miss streak
        combo++;
        comboTimer = 900;
        const pts = 10 * Math.max(combo,1);
        const prevScore = score;
        score += pts;
        // score number popup right at the cut
        spawnPopup(f.x, f.y, `+${pts}`, f.color, {fontSize:38});
        // a fun reaction word for every single slice, bold and large
        spawnPopup(f.x, f.y - 58, randomFrom(SLICE_COMMENTS), '#ffffff', {fontSize:32, decay:0.018});
        // celebrate every 100-point milestone with a big centered message
        if(Math.floor(score/100) > Math.floor(prevScore/100)){
          spawnPopup(canvas.width/2, canvas.height*0.32, randomFrom(SCORE_COMMENTS), '#feca57', {fontSize:52, decay:0.01, centered:true});
        }
        updateHud();
      }
    }
  }
}

// ---------- MediaPipe hand tracking ----------
let camera = null;
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.4,
  minTrackingConfidence: 0.4
});
hands.onResults(onHandResults);

function onHandResults(results){
  const detected = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

  for(let i = 0; i < 2; i++){
    if(i < detected){
      const tip = results.multiHandLandmarks[i][8]; // index fingertip
      // mirror x because the video is displayed mirrored
      const x = (1 - tip.x) * canvas.width;
      const y = tip.y * canvas.height;
      trails[i].push({x, y, t: performance.now()});
      if(trails[i].length > 8) trails[i].shift();
      if(gameState === 'playing') checkSlices(trails[i]);
    } else if(trails[i].length){
      // fade this hand's trail out gradually when it's no longer seen
      trails[i].shift();
    }
  }

  statusEl.textContent = (gameState === 'playing' && detected === 0) ? 'Show your hand(s) to the camera' : '';
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Starting camera...';
  try{
    if(!camera){
      camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 1280, height: 720
      });
    }
    await camera.start();
    startGame();
  }catch(err){
    overlayText.textContent = 'Camera access was blocked or unavailable. Please allow camera permission and reload the page.';
  }finally{
    startBtn.disabled = false;
    startBtn.textContent = 'Play Again';
  }
});

// ---------- Main loop ----------
function gameLoop(now){
  if(gameState !== 'playing') return;
  const dt = now - lastFrameTime;
  lastFrameTime = now;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // spawn
  spawnTimer += dt;
  if(spawnTimer > spawnInterval){
    spawnTimer = 0;
    spawnFruit();
    spawnInterval = Math.max(500, 1100 - score*0.8);
  }

  // combo timer
  if(comboTimer > 0){
    comboTimer -= dt;
    if(comboTimer <= 0){ combo = 0; updateHud(); }
  }

  // update + draw fruits
  for(let i = fruits.length - 1; i >= 0; i--){
    const f = fruits[i];
    if(!f.sliced){
      f.vy += GRAVITY;
      f.x += f.vx;
      f.y += f.vy;
      f.rotation += f.vr;

      if(f.y - f.r > canvas.height + 40){
        if(!f.isBomb){
          missStreak++;
          if(missStreak > 3){
            spawnPopup(canvas.width/2, canvas.height*0.4, randomFrom(MISS_COMMENTS), '#ff9f43', {fontSize:44, decay:0.011, centered:true});
          }
        }
        fruits.splice(i,1);
        continue;
      }
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.font = `${f.r*2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    } else {
      fruits.splice(i,1);
    }
  }

  // particles
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += GRAVITY*0.5;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // popups
  for(let i = popups.length - 1; i >= 0; i--){
    const p = popups[i];
    p.y -= p.centered ? 0.4 : 1.2;
    p.life -= p.decay;
    if(p.life <= 0){ popups.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.font = `800 ${p.fontSize}px Segoe UI, Arial`;
    ctx.textAlign = 'center';
    if(p.centered){
      // outline so big center-screen messages stay readable over gameplay
      ctx.lineWidth = Math.max(4, p.fontSize*0.08);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(p.text, p.x, p.y);
    }
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  // blade trails, one per hand
  for(const trail of trails){
    if(trail.length > 1){
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for(let i = 1; i < trail.length; i++){
        const alpha = i / trail.length;
        ctx.strokeStyle = `rgba(255,255,255,${alpha*0.9})`;
        ctx.lineWidth = 3 + alpha*6;
        ctx.beginPath();
        ctx.moveTo(trail[i-1].x, trail[i-1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
      // glowing tip
      const tipPt = trail[trail.length-1];
      const grad = ctx.createRadialGradient(tipPt.x,tipPt.y,0,tipPt.x,tipPt.y,18);
      grad.addColorStop(0,'rgba(254,202,87,0.9)');
      grad.addColorStop(1,'rgba(254,202,87,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(tipPt.x, tipPt.y, 18, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
