<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gesture Fruit Slicer</title>
<style>
  :root{
    --ink:#0b0f1a;
    --gold:#feca57;
    --coral:#ff6b6b;
    --leaf:#54e6a5;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--ink);font-family:'Segoe UI',Helvetica,Arial,sans-serif;height:100%;width:100%;}
  #videoFeed{
    position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;
    transform:scaleX(-1);opacity:0.5;filter:saturate(1.1) brightness(0.85);
  }
  #gameCanvas{position:fixed;top:0;left:0;width:100%;height:100%;}
  #hud{
    position:fixed;top:18px;left:18px;color:#fff;z-index:5;
    text-shadow:0 2px 8px rgba(0,0,0,.7);
    display:flex;flex-direction:column;gap:4px;
  }
  #hud .score{font-size:28px;font-weight:800;letter-spacing:.5px;}
  #hud .score span{color:var(--gold);}
  #hud .combo{font-size:15px;opacity:.85;height:18px;color:var(--leaf);font-weight:600;}
  #hud .lives{font-size:22px;}
  #endBtn{
    position:fixed;top:18px;right:18px;z-index:6;margin-top:0;
    padding:10px 20px;font-size:14px;border-radius:999px;
    background:rgba(20,24,36,0.7);color:#fff;font-weight:700;
    border:1.5px solid rgba(255,255,255,0.35);backdrop-filter:blur(4px);
  }
  #endBtn:hover{background:rgba(255,107,107,0.85);border-color:transparent;}
  #overlay{
    position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;text-align:center;z-index:10;background:rgba(5,8,15,0.86);padding:24px;
  }
  #overlay h1{
    font-size:clamp(32px,6vw,52px);margin:0 0 10px;
    background:linear-gradient(90deg,var(--coral),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    font-weight:900;letter-spacing:-1px;
  }
  #overlay p{max-width:460px;line-height:1.55;opacity:.85;font-size:15px;margin:0;}
  #overlay .final{font-size:20px;margin-top:6px;opacity:1;color:var(--gold);font-weight:700;}
  #nameInput{
    margin-top:22px;padding:12px 18px;font-size:16px;border-radius:999px;
    border:1.5px solid rgba(255,255,255,0.35);background:rgba(255,255,255,0.08);
    color:#fff;text-align:center;width:240px;max-width:80vw;outline:none;
  }
  #nameInput::placeholder{color:rgba(255,255,255,0.55);}
  #nameInput:focus{border-color:var(--gold);}
  button{
    margin-top:26px;padding:15px 34px;font-size:17px;border:none;border-radius:999px;
    background:linear-gradient(90deg,var(--coral),var(--gold));color:#1a1305;font-weight:800;
    cursor:pointer;letter-spacing:.3px;transition:transform .15s ease, filter .15s ease;
  }
  button:hover{filter:brightness(1.08);transform:translateY(-1px);}
  button:active{transform:translateY(0);}
  #status{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#9aa4bd;font-size:13px;z-index:5;}
  .hidden{display:none !important;}
</style>
</head>
<body>

<video id="videoFeed" autoplay playsinline muted></video>
<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
  <div class="score"><span id="playerNameEl"></span> Score: <span id="scoreVal">0</span></div>
  <div class="combo" id="comboText"></div>
  <div class="lives" id="livesEl"></div>
</div>

<button id="endBtn" class="hidden">✕ End Game</button>

<div id="status"></div>

<div id="overlay">
  <h1>Gesture Fruit Slicer</h1>
  <p id="overlayText">Point your webcam at yourself, then slice the flying fruit with your index fingertip — just like swiping a blade. You've got 5 lives — missed fruit costs one, a bomb ends it instantly. Beat your best score and things get harder!</p>
  <input id="nameInput" type="text" placeholder="Enter your name" maxlength="16">
  <button id="startBtn">Allow Camera &amp; Start</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" crossorigin="anonymous"></script>

<script>
const videoElement = document.getElementById('videoFeed');
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const startBtn = document.getElementById('startBtn');
const hud = document.getElementById('hud');
const scoreVal = document.getElementById('scoreVal');
const comboText = document.getElementById('comboText');
const livesEl = document.getElementById('livesEl');
const endBtn = document.getElementById('endBtn');
const statusEl = document.getElementById('status');
const nameInput = document.getElementById('nameInput');
const playerNameEl = document.getElementById('playerNameEl');
let playerName = 'Player';

function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

// ---------- Game state ----------
let gameState = 'idle'; // idle | playing | over
let score = 0;
const LIVES_START = 5;
let lives = LIVES_START;
let combo = 0;
let comboTimer = 0;
let spawnTimer = 0;
let spawnInterval = 1100;
let fruits = [];
let particles = [];
let popups = [];
let rings = []; // expanding shockwave rings drawn on every slice
let splats = []; // big soft juice-splat burst drawn on every slice
let missStreak = 0; // consecutive fruits missed without a slice in between
let trails = [[], []]; // recent fingertip points per hand: {x,y,t}
let lastFrameTime = performance.now();

// best score ever reached this browser session (kept only in memory, across "Play Again" runs)
let bestScore = 0;
let hasPlayedGameBefore = false; // guards against leveling up on your very first-ever game
let recordBrokenThisGame = false;
let encouraged30 = false; // fires the "You got this, name!" line once per game at 30 points

// difficulty ramps smoothly toward these targets once you beat your best score
let speedMultiplier = 1, speedMultiplierTarget = 1;
let bombChance = 0.12, bombChanceTarget = 0.12;

const GRAVITY = 0.32;

// fun word banks shown as bold, large on-screen text
const SLICE_COMMENTS = ['OMG!', 'Juicy!', 'Delicious!', 'So fresh!', 'Sweet!', 'You got this!'];
const MISS_COMMENTS = ["Stay focused!", "You've got this!", "Keep your eyes up!", "Don't give up!", "Shake it off!"];
const SCORE_COMMENTS = ['Awesome!', "You're on fire!", 'Incredible!', 'Fantastic!', 'Unstoppable!', 'Amazing streak!'];

function randomFrom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ---------- Audio: ambient ninja-style music + spoken reactions ----------
let musicStarted = false;

function startBackgroundMusic(){
  if(musicStarted || typeof Tone === 'undefined') return;
  musicStarted = true;
  Tone.start();

  const verb = new Tone.Reverb({ decay: 1.2, wet: 0.2 }).toDestination();

  // --- drum kit: kick, snare, hi-hat, tambourine shimmer ---
  const kick = new Tone.MembraneSynth({
    pitchDecay: 0.03, octaves: 4,
    envelope: { attack: 0.001, decay: 0.25, sustain: 0 }
  }).toDestination();
  kick.volume.value = -7;

  const snare = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.13, sustain: 0 }
  }).toDestination();
  snare.volume.value = -13;

  const hat = new Tone.NoiseSynth({
    noise: { type: 'white' },
    envelope: { attack: 0.001, decay: 0.03, sustain: 0 }
  }).toDestination();
  hat.volume.value = -25;

  const tambourine = new Tone.NoiseSynth({
    noise: { type: 'pink' },
    envelope: { attack: 0.001, decay: 0.06, sustain: 0 }
  }).toDestination();
  tambourine.volume.value = -22;

  // --- playful bouncy bass, root notes under the chords ---
  const bass = new Tone.PluckSynth({ attackNoise: 0.5, dampening: 3200, resonance: 0.8 }).connect(verb);
  bass.volume.value = -6;

  // --- guitar: bright upstroke skank chords ---
  const guitar = new Tone.PluckSynth({ attackNoise: 1, dampening: 3000, resonance: 0.9 }).connect(verb);
  guitar.volume.value = -7;

  // --- sparkly bell accent on the top of each bar ---
  const bell = new Tone.MetalSynth({
    envelope: { attack: 0.001, decay: 0.4, release: 0.1 },
    harmonicity: 5.1, modulationIndex: 16, resonance: 2000, octaves: 0.8
  }).connect(verb);
  bell.volume.value = -20;

  // --- flute: bouncy, playful melodic lead ---
  const vibrato = new Tone.Vibrato(5.5, 0.15).connect(verb);
  const flute = new Tone.Synth({
    oscillator: { type: 'sine' },
    envelope: { attack: 0.06, decay: 0.18, sustain: 0.55, release: 0.35 }
  }).connect(vibrato);
  flute.volume.value = -5;

  const chordProgression = [['C4','E4','G4'], ['F3','A3','C4'], ['G3','B3','D4'], ['C4','E4','G4']];
  const bassRoots = ['C2', 'F2', 'G2', 'C2'];
  // a bouncier, more playful 16-step melody with skips and a little call-and-response feel
  const fluteMelody = ['G4','C5','E4','G4','A4','C5','G4','E4','D5','C5','A4','G4','E4','G4','C5','D5'];

  let step = 0; // sixteenth-note steps, 16 per bar
  const musicLoop = new Tone.Loop((time) => {
    const beat = step % 16;
    const bar = Math.floor(step / 16);

    if(beat === 0) bell.triggerAttackRelease('C5', '8n', time);
    if(beat === 0 || beat === 8) bass.triggerAttackRelease(bassRoots[bar % bassRoots.length], '8n', time);
    if(beat === 0 || beat === 8) kick.triggerAttackRelease('C1', '8n', time);
    if(beat === 4 || beat === 12){
      snare.triggerAttackRelease('16n', time);
      const chord = chordProgression[bar % chordProgression.length];
      chord.forEach((n, i) => guitar.triggerAttackRelease(n, '16n', time + i*0.006));
    }
    hat.triggerAttackRelease('32n', time);
    if(beat % 4 === 2) tambourine.triggerAttackRelease('32n', time);

    flute.triggerAttackRelease(fluteMelody[beat], '16n', time);

    step++;
  }, '16n');

  Tone.Transport.bpm.value = 132;
  musicLoop.start(0);
  Tone.Transport.start();
}

// a short, punchy "fail" sound for bomb hits — a quick descending buzzer run
const failSynth = (typeof Tone !== 'undefined') ? new Tone.Synth({
  oscillator: { type: 'sawtooth' },
  envelope: { attack: 0.01, decay: 0.15, sustain: 0.05, release: 0.15 }
}).toDestination() : null;
if(failSynth) failSynth.volume.value = -6;

function playFailSound(){
  if(!failSynth) return;
  const now = Tone.now();
  const notes = ['G3', 'F#3', 'F3', 'E3'];
  notes.forEach((note, i) => failSynth.triggerAttackRelease(note, '8n', now + i*0.13));
}

let cachedVoice = null;
function pickEnergeticVoice(){
  if(!('speechSynthesis' in window)) return null;
  const voices = window.speechSynthesis.getVoices();
  if(!voices.length) return null;
  // prefer deeper, bolder-sounding voices for a dramatic, motivating tone
  const preferredNames = ['Google UK English Male', 'Microsoft David', 'Daniel', 'Alex', 'Google US English', 'Microsoft Zira'];
  for(const name of preferredNames){
    const match = voices.find(v => v.name.includes(name));
    if(match) return match;
  }
  return voices.find(v => v.lang.startsWith('en')) || voices[0];
}
if('speechSynthesis' in window){
  window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickEnergeticVoice(); };
  cachedVoice = pickEnergeticVoice();
}

let lastSpeechTime = 0;
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const now = performance.now();
  if(now - lastSpeechTime < 500) return; // avoid piling up overlapping speech on fast combos
  lastSpeechTime = now;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  if(cachedVoice) utter.voice = cachedVoice;
  utter.rate = 0.92 + Math.random()*0.08;  // deliberate, bold pace — not rushed
  utter.pitch = 0.82 + Math.random()*0.1;  // deeper, more dramatic tone
  utter.volume = 1;
  window.speechSynthesis.speak(utter);
}

const FRUIT_TYPES = [
  {emoji:'🍉', color:'#4fd67a', r:74},
  {emoji:'🍎', color:'#ff5c5c', r:60},
  {emoji:'🍊', color:'#ff9f43', r:60},
  {emoji:'🍇', color:'#9b6bff', r:60},
  {emoji:'🍋', color:'#f6e05e', r:56},
  {emoji:'🥝', color:'#8bc34a', r:54},
];
const BOMB = {emoji:'💣', color:'#333', r:60};

function resetGame(){
  score = 0; lives = LIVES_START; combo = 0; comboTimer = 0; missStreak = 0;
  fruits = []; particles = []; popups = []; trails = [[], []];
  rings = []; splats = [];
  spawnInterval = 1100;
  recordBrokenThisGame = false;
  encouraged30 = false;
  speedMultiplier = 1; speedMultiplierTarget = 1;
  bombChance = 0.12; bombChanceTarget = 0.12;
  updateHud();
}

function updateHud(){
  scoreVal.textContent = score;
  playerNameEl.textContent = playerName;
  comboText.textContent = combo > 1 ? `x${combo} combo!` : '';
  livesEl.textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(LIVES_START-lives,0));
}

function spawnFruit(){
  const isBomb = Math.random() < bombChance;
  const type = isBomb ? BOMB : FRUIT_TYPES[Math.floor(Math.random()*FRUIT_TYPES.length)];
  const x = 60 + Math.random() * (canvas.width - 120);
  const speedBoost = score < 150 ? 0 : Math.min((score - 150) / 300, 4);
  // pick a target peak height as a fraction of the screen, then solve for the
  // launch velocity needed to reach it under GRAVITY (v = sqrt(2 * g * h))
  const targetHeight = canvas.height * (0.62 + Math.random() * 0.3);
  const vy = (-Math.sqrt(2 * GRAVITY * targetHeight) - speedBoost * 0.5) * speedMultiplier;
  const vx = (Math.random()-0.5) * 4 * speedMultiplier;
  fruits.push({
    x, y: canvas.height + 60, vx, vy, r: type.r,
    emoji: type.emoji, color: type.color, isBomb,
    sliced: false, rotation: Math.random()*Math.PI*2,
    vr: (Math.random()-0.5)*0.15
  });
}

function spawnParticles(x,y,color,count=42){
  for(let i=0;i<count;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 5 + Math.random()*11;
    particles.push({
      x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 4,
      life:1, decay: 0.009 + Math.random()*0.012, color, size: 5+Math.random()*11
    });
  }
  // bright white sparkles mixed in for extra pop
  for(let i=0;i<14;i++){
    const angle = Math.random()*Math.PI*2;
    const speed = 5 + Math.random()*7;
    particles.push({
      x,y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed - 5,
      life:1, decay: 0.018, color:'#ffffff', size: 2.5+Math.random()*4
    });
  }
}

function spawnSplat(x,y,color,radius){
  splats.push({x, y, radius:0, maxRadius:radius, alpha:0.9, color});
}

function spawnRing(x,y,color){
  rings.push({x, y, radius:14, alpha:0.9, color});
  rings.push({x, y, radius:6, alpha:0.7, color}); // a second, tighter ring for extra impact
}

function spawnPopup(x,y,text,color,options={}){
  popups.push({
    x, y, text, color, life:1,
    decay: options.decay ?? 0.02,
    fontSize: options.fontSize ?? 26,
    centered: options.centered ?? false
  });
}

function gameOver(reason){
  gameState = 'over';
  if(camera) camera.stop();
  hud.classList.add('hidden');
  endBtn.classList.add('hidden');
  overlay.classList.remove('hidden');
  if(score > bestScore) bestScore = score;
  hasPlayedGameBefore = true;

  let message;
  if(reason === 'lives') message = "Out of lives — game over. Try again?";
  else if(reason === 'manual') message = "Game ended. Nice run!";
  else message = "You sliced a bomb — game over. Try again?";

  overlayText.innerHTML = `<span class="final">Final Score: ${score}</span><br><br>${message}`;
  startBtn.textContent = 'Play Again';
}

function startGame(){
  resetGame();
  gameState = 'playing';
  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  endBtn.classList.remove('hidden');
  lastFrameTime = performance.now();
  requestAnimationFrame(gameLoop);
}

endBtn.addEventListener('click', () => {
  if(gameState === 'playing') gameOver('manual');
});

// ---------- Slicing detection ----------
function pointSegmentDistance(px,py, ax,ay, bx,by){
  const dx = bx-ax, dy = by-ay;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function checkSlices(trail){
  if(trail.length < 2) return;
  const a = trail[trail.length-2];
  const b = trail[trail.length-1];
  const dt = Math.max(b.t - a.t, 1);
  const dist = Math.hypot(b.x-a.x, b.y-a.y);
  const speed = dist / dt; // px per ms
  if(speed < 0.15) return; // require a real swipe, not a slow drift

  for(const f of fruits){
    if(f.sliced) continue;
    const d = pointSegmentDistance(f.x, f.y, a.x, a.y, b.x, b.y);
    if(d < f.r){
      f.sliced = true;
      spawnParticles(f.x, f.y, f.color, f.isBomb ? 50 : 38);
      if(f.isBomb){
        spawnPopup(f.x, f.y, 'BOOM', '#ff5c5c', {fontSize:34});
        playFailSound();
        gameOver('bomb');
        return;
      } else {
        spawnRing(f.x, f.y, f.color);
        spawnSplat(f.x, f.y, f.color, f.r * 3.2);
        missStreak = 0; // a successful slice breaks any miss streak
        combo++;
        comboTimer = 900;
        const pts = 10 * Math.max(combo,1);
        const prevScore = score;
        score += pts;
        // score number popup right at the cut
        spawnPopup(f.x, f.y, `+${pts}`, f.color, {fontSize:38});
        // a fun reaction word for every single slice, bold, large, and spoken aloud
        const reaction = randomFrom(SLICE_COMMENTS);
        spawnPopup(f.x, f.y - 58, reaction, '#ffffff', {fontSize:32, decay:0.018});
        speak(reaction);
        // a personal shout-out the first time you cross 30 points
        if(!encouraged30 && score >= 30){
          encouraged30 = true;
          speak(`You got this, ${playerName}!`);
        }
        // celebrate every 100-point milestone with a big centered message
        if(Math.floor(score/100) > Math.floor(prevScore/100)){
          const praise = randomFrom(SCORE_COMMENTS);
          spawnPopup(canvas.width/2, canvas.height*0.32, praise, '#feca57', {fontSize:52, decay:0.01, centered:true});
          speak(praise);
        }
        // beat your all-time best this game? level up the difficulty, once per game
        if(hasPlayedGameBefore && !recordBrokenThisGame && score > bestScore){
          recordBrokenThisGame = true;
          speedMultiplierTarget = 1.2;
          bombChanceTarget = 0.18;
          spawnPopup(canvas.width/2, canvas.height*0.5, 'NEW HIGH SCORE! Level Up!', '#feca57', {fontSize:50, decay:0.008, centered:true});
          speak('New high score! Level up!');
        }
        updateHud();
      }
    }
  }
}

// ---------- MediaPipe hand tracking ----------
let camera = null;
const hands = new Hands({
  locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 0,
  minDetectionConfidence: 0.4,
  minTrackingConfidence: 0.4
});
hands.onResults(onHandResults);

function onHandResults(results){
  const detected = results.multiHandLandmarks ? results.multiHandLandmarks.length : 0;

  for(let i = 0; i < 2; i++){
    if(i < detected){
      const tip = results.multiHandLandmarks[i][8]; // index fingertip
      // mirror x because the video is displayed mirrored
      const x = (1 - tip.x) * canvas.width;
      const y = tip.y * canvas.height;
      trails[i].push({x, y, t: performance.now()});
      if(trails[i].length > 5) trails[i].shift();
      if(gameState === 'playing') checkSlices(trails[i]);
    } else if(trails[i].length){
      // fade this hand's trail out gradually when it's no longer seen
      trails[i].shift();
    }
  }

  statusEl.textContent = (gameState === 'playing' && detected === 0) ? 'Show your hand(s) to the camera' : '';
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  startBtn.textContent = 'Starting camera...';
  playerName = nameInput.value.trim() || 'Player';
  startBackgroundMusic();
  try{
    if(!camera){
      camera = new Camera(videoElement, {
        onFrame: async () => { await hands.send({image: videoElement}); },
        width: 960, height: 540
      });
    }
    await camera.start();
    startGame();
  }catch(err){
    overlayText.textContent = 'Camera access was blocked or unavailable. Please allow camera permission and reload the page.';
  }finally{
    startBtn.disabled = false;
    startBtn.textContent = 'Play Again';
  }
});

// ---------- Main loop ----------
function gameLoop(now){
  if(gameState !== 'playing') return;
  const dt = now - lastFrameTime;
  lastFrameTime = now;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // spawn
  spawnTimer += dt;
  if(spawnTimer > spawnInterval){
    spawnTimer = 0;
    spawnFruit();
    const difficultyScore = Math.max(score - 150, 0);
    spawnInterval = Math.max(400, (1100 - difficultyScore*0.8) / speedMultiplier);
  }

  // combo timer
  if(comboTimer > 0){
    comboTimer -= dt;
    if(comboTimer <= 0){ combo = 0; updateHud(); }
  }

  // smoothly ramp difficulty toward its target (e.g. after a level-up) instead of jumping instantly
  speedMultiplier += (speedMultiplierTarget - speedMultiplier) * 0.01;
  bombChance += (bombChanceTarget - bombChance) * 0.01;

  // update + draw fruits
  for(let i = fruits.length - 1; i >= 0; i--){
    const f = fruits[i];
    if(!f.sliced){
      f.vy += GRAVITY;
      f.x += f.vx;
      f.y += f.vy;
      f.rotation += f.vr;

      if(f.y - f.r > canvas.height + 40){
        if(!f.isBomb){
          missStreak++;
          lives--;
          updateHud();
          if(missStreak > 3){
            spawnPopup(canvas.width/2, canvas.height*0.4, randomFrom(MISS_COMMENTS), '#ff9f43', {fontSize:44, decay:0.011, centered:true});
          }
          if(lives <= 0){
            fruits.splice(i,1);
            gameOver('lives');
            return;
          }
        }
        fruits.splice(i,1);
        continue;
      }
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.font = `${f.r*2}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    } else {
      fruits.splice(i,1);
    }
  }

  // particles (drawn as stretched droplets for a juicier, liquid splash look)
  for(let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.vy += GRAVITY*0.5;
    p.x += p.vx; p.y += p.vy;
    p.life -= p.decay;
    if(p.life <= 0){ particles.splice(i,1); continue; }
    const speed = Math.hypot(p.vx, p.vy);
    ctx.save();
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.vy, p.vx));
    ctx.scale(1 + Math.min(speed*0.1, 2.2), 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(0, 0, p.size, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // big soft juice splat burst
  for(let i = splats.length - 1; i >= 0; i--){
    const s = splats[i];
    s.radius += (s.maxRadius - s.radius) * 0.5;
    s.alpha -= 0.022;
    if(s.alpha <= 0){ splats.splice(i,1); continue; }
    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius);
    grad.addColorStop(0, s.color);
    grad.addColorStop(0.55, s.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalAlpha = Math.max(s.alpha,0);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // slice shockwave rings
  for(let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.radius += 6;
    r.alpha -= 0.03;
    if(r.alpha <= 0){ rings.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(r.alpha,0);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.radius, 0, Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // popups
  for(let i = popups.length - 1; i >= 0; i--){
    const p = popups[i];
    p.y -= p.centered ? 0.4 : 1.2;
    p.life -= p.decay;
    if(p.life <= 0){ popups.splice(i,1); continue; }
    ctx.globalAlpha = Math.max(p.life,0);
    ctx.font = `800 ${p.fontSize}px Segoe UI, Arial`;
    ctx.textAlign = 'center';
    if(p.centered){
      // outline so big center-screen messages stay readable over gameplay
      ctx.lineWidth = Math.max(4, p.fontSize*0.08);
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(p.text, p.x, p.y);
    }
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }

  // blade trails, one per hand
  for(const trail of trails){
    if(trail.length > 1){
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for(let i = 1; i < trail.length; i++){
        const alpha = i / trail.length;
        ctx.strokeStyle = `rgba(255,255,255,${alpha*0.9})`;
        ctx.lineWidth = 3 + alpha*6;
        ctx.beginPath();
        ctx.moveTo(trail[i-1].x, trail[i-1].y);
        ctx.lineTo(trail[i].x, trail[i].y);
        ctx.stroke();
      }
      // glowing tip
      const tipPt = trail[trail.length-1];
      const grad = ctx.createRadialGradient(tipPt.x,tipPt.y,0,tipPt.x,tipPt.y,18);
      grad.addColorStop(0,'rgba(254,202,87,0.9)');
      grad.addColorStop(1,'rgba(254,202,87,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(tipPt.x, tipPt.y, 18, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
    }
  }

  requestAnimationFrame(gameLoop);
}
</script>
</body>
